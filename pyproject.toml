[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceplus-py"
version = "0.1.0"
description = "Structured JSON logging and trace context for the Python process you already run."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Amit Singh Sansoya" }]
keywords = ["logging", "telemetry", "tracing", "cloudwatch", "json"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Amit3200/traceplus"
Repository = "https://github.com/Amit3200/traceplus"
Issues = "https://github.com/Amit3200/traceplus/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["traceplus", "traceplus.middleware"]

[tool.setuptools.package-dir]
traceplus = "."

[tool.setuptools.package-data]
traceplus = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
